<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="assets/monogram.png">
<title>Tova-Ster Store Demo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
@font-face { font-family: "Instrument Sans"; src: url("fonts/instrument-sans-latin-400-normal.woff2") format("woff2"); font-weight: 400; font-display: swap; }
@font-face { font-family: "Instrument Sans"; src: url("fonts/instrument-sans-latin-500-normal.woff2") format("woff2"); font-weight: 500; font-display: swap; }
@font-face { font-family: "Instrument Sans"; src: url("fonts/instrument-sans-latin-600-normal.woff2") format("woff2"); font-weight: 600; font-display: swap; }
@font-face { font-family: "Instrument Sans"; src: url("fonts/instrument-sans-latin-700-normal.woff2") format("woff2"); font-weight: 700; font-display: swap; }
@font-face { font-family: "Literata"; src: url("fonts/literata-latin-400-normal.woff2") format("woff2"); font-weight: 400; font-display: swap; }
@font-face { font-family: "Literata"; src: url("fonts/literata-latin-500-normal.woff2") format("woff2"); font-weight: 500; font-display: swap; }
@font-face { font-family: "Literata"; src: url("fonts/literata-latin-600-normal.woff2") format("woff2"); font-weight: 600; font-display: swap; }

/* Layout: a full commerce storefront (mega menu, grids, drawer) and a back office
   on a fixed sidebar. One light theme by choice: the brand is gold on black on white. */
:root {
  color-scheme: light;
  --bg: #FFFFFF;
  --surface: #F3F2EF;        /* product wells, quiet panels */
  --surface-2: #E9E7E2;
  --ink: #151413;
  --ink-2: #57544F;          /* secondary text */
  --ink-3: #8A867F;
  --line: #E2DFD9;
  --black: #0F0F0E;
  --on-black: #FFFFFF;
  --gold: #B8882C;           /* brand accent: points, stars, highlights */
  --gold-ink: #7A5A14;       /* gold for text on white */
  --gold-soft: #F4EAD3;
  --sale: #B42318;
  --sale-soft: #FBE9E7;
  --good: #23683A;
  --good-soft: #E5F1E8;
  --warn: #9A5B00;
  --warn-soft: #FCF0DC;
  --f-d3: #E9C25E; --f-iron: #6E2430;
  --f-collagen: #F4CBB6; --f-kids: #F6D2DE; --f-creatine: #1B1B1A;

  --display: "Literata", Georgia, "Times New Roman", serif;
  --ui: "Instrument Sans", "Helvetica Neue", Arial, sans-serif;

  --r-sm: 8px; --r: 14px; --r-lg: 22px;
  --max: 1320px; --gutter: 20px;
  --ease: cubic-bezier(.2, .8, .2, 1);
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--ui); font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
img { max-width: 100%; display: block; }
a { color: inherit; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3, h4 { margin: 0; text-wrap: balance; }
p { margin: 0; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; border-radius: 4px; }
.num { font-variant-numeric: tabular-nums; }
.wrap { max-width: var(--max); margin: 0 auto; padding-left: max(var(--gutter), env(safe-area-inset-left, 0px)); padding-right: max(var(--gutter), env(safe-area-inset-right, 0px)); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; } }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 0 22px; border-radius: 999px; border: 1px solid transparent; background: var(--black); color: var(--on-black); font-weight: 600; font-size: 15px; cursor: pointer; text-decoration: none; transition: transform .15s var(--ease), background-color .2s, border-color .2s; white-space: nowrap; }
.btn:hover { background: #2A2926; }
.btn:active { transform: scale(.97); }
.btn.gold { background: var(--gold); color: #1A1406; }
.btn.gold:hover { background: #A67A22; }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn.ghost:hover { border-color: var(--ink); }
.btn.light { background: #fff; color: var(--black); }
.btn.sm { min-height: 36px; padding: 0 14px; font-size: 14px; }
.btn.block { width: 100%; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.link { background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; font-weight: 600; }

/* Demo bar */
.demobar { background: var(--black); color: #CFCBC2; font-size: 13px; }
.demobar .wrap { display: flex; align-items: center; gap: 16px; min-height: 40px; flex-wrap: wrap; }
.demobar strong { color: #fff; font-weight: 600; }
.seg { display: inline-flex; background: #2A2926; border-radius: 999px; padding: 3px; }
.seg button { border: 0; background: transparent; color: #CFCBC2; padding: 4px 14px; border-radius: 999px; cursor: pointer; font-size: 13px; font-weight: 600; }
.seg button[aria-pressed="true"] { background: var(--gold); color: #1A1406; }
.demobar .grow { flex: 1; }
.demobar .link { color: #CFCBC2; font-weight: 500; font-size: 13px; }

/* Announcement */
.announce { background: var(--gold-soft); color: var(--gold-ink); font-size: 14px; font-weight: 600; text-align: center; padding: 9px 16px; }
.announce span { display: inline-block; animation: fadein .5s var(--ease); }
@keyframes fadein { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

/* Header */
.hdr { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 40; background: var(--bg); border-bottom: 1px solid var(--line); }
.hdr .wrap { display: flex; align-items: center; gap: 28px; height: 72px; }
.logo { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; cursor: pointer; background: none; border: 0; padding: 0; }
.logo img { width: 28px; height: 37px; object-fit: contain; }
.logo b { font-family: var(--display); font-size: 21px; font-weight: 600; letter-spacing: .02em; }
.mainnav { display: flex; gap: 4px; height: 100%; }
.mainnav > div { position: static; display: flex; align-items: center; }
.mainnav > div > button { background: none; border: 0; height: 100%; padding: 0 12px; font-weight: 600; font-size: 15px; cursor: pointer; border-bottom: 2px solid transparent; }
.mainnav > div:hover > button, .mainnav > div:focus-within > button { border-bottom-color: var(--ink); }
.mega { position: absolute; left: 0; right: 0; top: 100%; background: var(--bg); border-bottom: 1px solid var(--line); box-shadow: 0 24px 40px -24px rgba(20,18,14,.25); padding: 28px 0 32px; display: none; }
.mainnav > div:hover .mega, .mainnav > div:focus-within .mega { display: block; }
.mega .wrap { height: auto; display: grid; grid-template-columns: repeat(3, 1fr) 1.4fr; gap: 32px; align-items: start; }
.mega h4 { font-size: 13px; color: var(--ink-3); font-weight: 600; margin-bottom: 10px; }
.mega ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.mega li button { background: none; border: 0; padding: 4px 0; cursor: pointer; font-size: 15px; text-align: left; }
.mega li button:hover { color: var(--gold-ink); text-decoration: underline; }
.mega .promo { background: var(--black); color: #fff; border-radius: var(--r); padding: 22px; display: grid; gap: 10px; }
.mega .promo h3 { font-family: var(--display); font-weight: 500; font-size: 22px; }
.mega .promo p { color: #CFCBC2; font-size: 14px; }
.hdr .tools { margin-left: auto; display: flex; align-items: center; gap: 6px; }
.search { position: relative; }
.search input { width: 260px; height: 42px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); padding: 0 16px 0 40px; font-size: 14px; }
.search input:focus { outline: none; border-color: var(--ink); background: #fff; }
.search svg { position: absolute; left: 14px; top: 13px; }
.sugg { position: absolute; right: 0; top: 50px; width: 380px; background: #fff; border: 1px solid var(--line); border-radius: var(--r); box-shadow: 0 20px 40px -20px rgba(20,18,14,.3); padding: 14px; display: grid; gap: 12px; z-index: 50; }
.sugg h4 { font-size: 12px; color: var(--ink-3); font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 5px 12px; font-size: 13px; cursor: pointer; }
.chip:hover { border-color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--black); color: #fff; border-color: var(--black); }
.sugg .row { display: flex; gap: 12px; align-items: center; cursor: pointer; padding: 6px; border-radius: var(--r-sm); background: none; border: 0; text-align: left; width: 100%; }
.sugg .row:hover { background: var(--surface); }
.sugg .row .th { width: 44px; height: 44px; border-radius: 8px; overflow: hidden; flex: none; background: var(--surface); }
.icon-btn { position: relative; width: 44px; height: 44px; display: grid; place-items: center; border-radius: 999px; border: 0; background: none; cursor: pointer; }
.icon-btn:hover { background: var(--surface); }
.badge-count { position: absolute; top: 4px; right: 2px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; background: var(--gold); color: #1A1406; font-size: 11px; font-weight: 700; display: grid; place-items: center; }
.pts-pill { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; background: var(--gold-soft); color: var(--gold-ink); border-radius: 999px; padding: 6px 12px; border: 0; cursor: pointer; }
.burger { display: none; }

/* Hero */
.hero { padding: 20px 0 0; }
.hero-card { background: var(--black); color: #fff; border-radius: var(--r-lg); display: grid; grid-template-columns: 1.05fr 1fr; overflow: hidden; min-height: 520px; position: relative; }
.hero-copy { padding: 64px 56px; display: flex; flex-direction: column; justify-content: center; gap: 22px; position: relative; z-index: 1; }
.hero-copy .kicker { color: var(--gold); font-weight: 600; font-size: 15px; }
.hero-copy h1 { font-family: var(--display); font-weight: 500; font-size: clamp(38px, 4.6vw, 64px); line-height: 1.04; letter-spacing: -.02em; }
.hero-copy p { color: #D6D2C9; font-size: 18px; max-width: 34em; }
.hero-actions { display: flex; gap: 12px; flex-wrap: wrap; }
.who { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
.who button { background: #262522; color: #fff; border: 1px solid #3A3834; border-radius: 999px; padding: 8px 16px; font-weight: 600; font-size: 14px; cursor: pointer; transition: background-color .2s, border-color .2s; }
.who button:hover { background: #33312D; border-color: var(--gold); }
.hero-visual { position: relative; min-height: 420px; }
.hero-visual .main { position: absolute; inset: 0; }
.hero-visual .main img { width: 100%; height: 100%; object-fit: cover; }
.hero-visual .mini { position: absolute; width: 34%; aspect-ratio: 1; border-radius: var(--r); overflow: hidden; border: 4px solid var(--black); background: var(--surface); }
.hero-visual .mini img, .hero-visual .mini svg { width: 100%; height: 100%; object-fit: cover; }
.hero-visual .m1 { left: -10%; bottom: 8%; }
.hero-visual .m2 { right: 6%; bottom: -4%; width: 28%; }
.hero-seal { position: absolute; right: 22px; top: 22px; width: 56px; opacity: .95; }

/* Trust strip */
.trust { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 16px; }
.trust div { background: var(--surface); border-radius: var(--r); padding: 16px 18px; display: flex; gap: 12px; align-items: center; font-size: 14px; }
.trust b { display: block; font-size: 15px; }
.trust svg { flex: none; }

/* Sections */
.sec { padding: 72px 0 0; }
.sec-head { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin-bottom: 24px; flex-wrap: wrap; }
.sec-head h2 { font-family: var(--display); font-weight: 500; font-size: clamp(28px, 3vw, 40px); letter-spacing: -.015em; line-height: 1.1; }
.sec-head p { color: var(--ink-2); margin-top: 6px; }

/* Needs */
.needs { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; }
.need { border: 0; cursor: pointer; text-align: left; border-radius: var(--r); padding: 18px; min-height: 190px; display: flex; flex-direction: column; justify-content: flex-start; gap: 12px; position: relative; overflow: hidden; transition: transform .25s var(--ease); }
.need:hover { transform: translateY(-3px); }
.need b { font-size: 17px; font-weight: 600; line-height: 1.2; position: relative; z-index: 1; }
.need small { font-size: 13px; position: relative; z-index: 1; opacity: .85; }
.need .pic { position: absolute; right: -14px; bottom: -14px; width: 54%; aspect-ratio: 1; border-radius: 50%; overflow: hidden; }
.need .pic img, .need .pic svg { width: 100%; height: 100%; object-fit: cover; }

/* Product grid + card */
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 20px; }
.card { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.card .well { position: relative; border-radius: var(--r); background: var(--surface); aspect-ratio: 1; overflow: hidden; cursor: pointer; border: 0; padding: 0; width: 100%; }
.card .well img, .card .well svg { width: 100%; height: 100%; object-fit: cover; transition: transform .6s var(--ease); }
.card .well:hover img, .card .well:hover svg { transform: scale(1.04); }
.tags { position: absolute; left: 10px; top: 10px; display: flex; gap: 6px; flex-wrap: wrap; }
.tag { font-size: 12px; font-weight: 700; padding: 4px 9px; border-radius: 999px; background: #fff; color: var(--ink); }
.tag.sale { background: var(--sale); color: #fff; }
.tag.gold { background: var(--gold); color: #1A1406; }
.tag.dark { background: var(--black); color: #fff; }
.quick { position: absolute; right: 10px; bottom: 10px; opacity: 0; transform: translateY(6px); transition: opacity .2s, transform .25s var(--ease); }
.card:hover .quick, .card:focus-within .quick { opacity: 1; transform: none; }
.card h3 { font-size: 16px; font-weight: 600; line-height: 1.3; }
.card h3 button { background: none; border: 0; padding: 0; text-align: left; cursor: pointer; }
.card h3 button:hover { text-decoration: underline; }
.card .meta { font-size: 14px; color: var(--ink-2); }
.price-row { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.price { font-weight: 700; font-size: 17px; }
.was { color: var(--ink-3); text-decoration: line-through; font-size: 14px; }
.subprice { font-size: 13px; color: var(--good); font-weight: 600; }
.perday { font-size: 13px; color: var(--ink-3); }
.card .add { margin-top: auto; }
.stars { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-2); }
.stars i { color: var(--gold); font-style: normal; letter-spacing: 1px; }

/* Bands */
.band { border-radius: var(--r-lg); padding: 48px; display: grid; grid-template-columns: 1.1fr 1fr; gap: 40px; align-items: center; }
.band h2 { font-family: var(--display); font-weight: 500; font-size: clamp(28px, 3vw, 42px); line-height: 1.08; letter-spacing: -.015em; }
.band p { font-size: 17px; margin-top: 12px; max-width: 34em; }
.band .actions { display: flex; gap: 12px; margin-top: 24px; flex-wrap: wrap; }
.band.quizband { background: var(--gold); color: #1A1406; }
.band.quizband p { color: #3A2C0C; }
.qpreview { background: #fff; border-radius: var(--r); padding: 22px; display: grid; gap: 12px; box-shadow: 0 30px 50px -30px rgba(40,28,4,.5); }
.qpreview b { font-size: 17px; }
.qpreview .opt { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; font-size: 15px; display: flex; justify-content: space-between; }
.qpreview .opt.on { border-color: var(--ink); background: var(--surface); font-weight: 600; }
.qbar { height: 6px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.qbar span { display: block; height: 100%; background: var(--gold); }

.bundles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
.bundle { background: var(--surface); border-radius: var(--r-lg); padding: 20px; display: grid; gap: 14px; align-content: start; }
.bundle .pics { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.bundle .pics div { aspect-ratio: 1; border-radius: var(--r); overflow: hidden; background: #fff; }
.bundle .pics img, .bundle .pics svg { width: 100%; height: 100%; object-fit: cover; }
.bundle h3 { font-family: var(--display); font-weight: 500; font-size: 24px; }
.bundle p { color: var(--ink-2); font-size: 15px; }
.bundle .foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

.perks { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.perk { border-radius: var(--r-lg); padding: 36px; display: grid; gap: 16px; align-content: start; }
.perk.dark { background: var(--black); color: #fff; }
.perk.dark p, .perk.dark li { color: #D6D2C9; }
.perk.light { background: var(--surface); }
.perk h2 { font-family: var(--display); font-weight: 500; font-size: 32px; letter-spacing: -.01em; line-height: 1.1; }
.perk ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; }
.perk li { display: flex; gap: 10px; align-items: flex-start; }
.perk li::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--gold); margin-top: 8px; flex: none; }
.big-figure { font-family: var(--display); font-size: 64px; line-height: 1; color: var(--gold); }

.news { background: var(--surface); border-radius: var(--r-lg); padding: 40px 48px; display: grid; grid-template-columns: 1fr 1fr; gap: 32px; align-items: center; }
.news h2 { font-family: var(--display); font-weight: 500; font-size: 30px; }
.news form { display: flex; gap: 8px; flex-wrap: wrap; }
.news input[type=email] { flex: 1; min-width: 200px; height: 46px; border-radius: 999px; border: 1px solid var(--line); padding: 0 18px; background: #fff; }
.news label.consent { display: flex; gap: 8px; font-size: 13px; color: var(--ink-2); margin-top: 10px; width: 100%; align-items: flex-start; }

footer.site { margin-top: 88px; background: var(--black); color: #CFCBC2; }
footer.site .wrap { padding-block: 56px 32px; display: grid; gap: 40px; }
.fcols { display: grid; grid-template-columns: 1.4fr repeat(3, 1fr); gap: 32px; }
.fcols h4 { color: #fff; font-size: 14px; margin-bottom: 12px; }
.fcols ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; font-size: 14px; }
.fcols button { background: none; border: 0; padding: 0; color: #CFCBC2; cursor: pointer; font-size: 14px; }
.fcols button:hover { color: #fff; text-decoration: underline; }
.paylogos { display: flex; gap: 8px; flex-wrap: wrap; }
.paylogos span { background: #fff; color: var(--black); border-radius: 6px; font-size: 12px; font-weight: 700; padding: 5px 9px; }
.legal { font-size: 13px; color: #A39F96; border-top: 1px solid #2A2926; padding-top: 20px; display: flex; justify-content: space-between; gap: 20px; flex-wrap: wrap; }

/* Shop page */
.crumbs { font-size: 14px; color: var(--ink-3); padding: 20px 0 8px; display: flex; gap: 8px; flex-wrap: wrap; }
.crumbs button { background: none; border: 0; padding: 0; cursor: pointer; color: var(--ink-2); }
.shop-head { display: flex; justify-content: space-between; align-items: end; gap: 20px; flex-wrap: wrap; padding-bottom: 20px; }
.shop-head h1 { font-family: var(--display); font-weight: 500; font-size: clamp(32px, 3.6vw, 48px); letter-spacing: -.02em; }
.shop-layout { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 36px; align-items: start; }
.filters { position: sticky; top: 96px; display: grid; gap: 26px; }
.filters h4 { font-size: 14px; margin-bottom: 10px; }
.filters label { display: flex; gap: 10px; align-items: center; font-size: 15px; padding: 5px 0; cursor: pointer; }
.filters input[type=checkbox], .filters input[type=radio] { width: 18px; height: 18px; accent-color: var(--black); }
.toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
.select { height: 40px; border: 1px solid var(--line); border-radius: 999px; padding: 0 14px; background: #fff; }
.grid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.empty { padding: 48px; text-align: center; background: var(--surface); border-radius: var(--r); display: grid; gap: 12px; justify-items: center; }

/* Product page */
.pdp { display: grid; grid-template-columns: 1.1fr 1fr; gap: 56px; align-items: start; padding-top: 8px; }
.gallery { display: grid; grid-template-columns: 76px 1fr; gap: 14px; position: sticky; top: 96px; }
.thumbs { display: grid; gap: 10px; align-content: start; }
.thumbs button { aspect-ratio: 1; border-radius: 10px; overflow: hidden; border: 2px solid transparent; padding: 0; cursor: pointer; background: var(--surface); }
.thumbs button[aria-pressed="true"] { border-color: var(--ink); }
.thumbs img, .thumbs svg { width: 100%; height: 100%; object-fit: cover; }
.mainimg { aspect-ratio: 1; border-radius: var(--r-lg); overflow: hidden; background: var(--surface); }
.mainimg img, .mainimg svg { width: 100%; height: 100%; object-fit: cover; }
.mainimg .facts-tile { width: 100%; height: 100%; padding: 48px; display: grid; align-content: center; gap: 14px; }
.facts-tile h3 { font-family: var(--display); font-weight: 500; font-size: 30px; }
.facts-tile table { border-collapse: collapse; width: 100%; font-size: 15px; }
.facts-tile td { padding: 10px 0; border-bottom: 1px solid var(--line); }
.facts-tile td:last-child { text-align: right; font-weight: 600; }
.buy { display: grid; gap: 18px; }
.buy h1 { font-family: var(--display); font-weight: 500; font-size: clamp(30px, 3.2vw, 44px); line-height: 1.08; letter-spacing: -.02em; }
.buy .lead { color: var(--ink-2); font-size: 17px; }
.benefits { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.benefits li { display: flex; gap: 10px; font-size: 15px; }
.benefits li svg { flex: none; margin-top: 3px; }

/* Toast */

/* ── Admin ─────────────────────────────────────────────────────── */

.side { background: var(--black); color: #CFCBC2; padding: 20px 14px; display: flex; flex-direction: column; gap: 4px; position: sticky; top: 0; height: calc(100vh - 40px); overflow-y: auto; }

.atop { display: none; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; align-items: center; gap: 12px; background: var(--black); color: #fff; padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); }

.amain { padding: 28px 32px 48px; display: grid; gap: 22px; align-content: start; min-width: 0; }

.up { color: var(--good); } .down { color: var(--sale); }

.tbl-wrap { overflow-x: auto; }

.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; border-radius: 999px; padding: 3px 10px; white-space: nowrap; }

.mini-th { width: 40px; height: 40px; border-radius: 8px; overflow: hidden; background: var(--surface); }

.features { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }

.frow { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: 14px; flex-wrap: wrap; }

.apanel { position: fixed; top: 0; right: 0; bottom: 0; width: min(520px, 100%); background: #fff; z-index: 90; display: flex; flex-direction: column; animation: slidein .3s var(--ease); padding-top: env(safe-area-inset-top, 0px); padding-right: env(safe-area-inset-right, 0px); }

.attn { display: grid; gap: 10px; }

/* ── Hero carousel: every slide sits in the same grid cell, so the card is as
   tall as the tallest slide and nothing jumps when they change. ── */
.hero-car { position: relative; border-radius: var(--r-lg); overflow: hidden; background: var(--black); color: #fff; touch-action: pan-y; }
.hero-slides { display: grid; }
.hero-slide { grid-area: 1 / 1; display: grid; grid-template-columns: 1.05fr 1fr; min-height: 540px; opacity: 0; visibility: hidden; transition: opacity .7s var(--ease), visibility 0s linear .7s; }
.hero-slide.on { opacity: 1; visibility: visible; transition: opacity .7s var(--ease), visibility 0s; z-index: 1; }
.hero-slide .hero-copy { padding: 60px 56px 104px; }
.hero-slide .hero-copy > * { transform: translateY(14px); opacity: 0; transition: transform .7s var(--ease), opacity .7s var(--ease); }
.hero-slide.on .hero-copy > * { transform: none; opacity: 1; }
.hero-slide.on .hero-copy > *:nth-child(2) { transition-delay: .06s; } .hero-slide.on .hero-copy > *:nth-child(3) { transition-delay: .12s; }
.hero-slide.on .hero-copy > *:nth-child(4) { transition-delay: .18s; } .hero-slide.on .hero-copy > *:nth-child(5) { transition-delay: .24s; }
.hero-slide .hero-visual { position: relative; overflow: hidden; background: #F1EBDD; }
.hero-slide .hero-visual > .media { position: absolute; inset: 0; }
.hero-slide .hero-visual > .media img, .hero-slide .hero-visual > .media video, .hero-slide .hero-visual > .media svg { width: 100%; height: 100%; object-fit: cover; display: block; transform: scale(1.06); transition: transform 7s linear; }
.hero-slide.on .hero-visual > .media img, .hero-slide.on .hero-visual > .media video, .hero-slide.on .hero-visual > .media svg { transform: scale(1); }
.hero-price { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; color: #D6D2C9; font-size: 15px; }
.hero-price b { color: #fff; font-size: 22px; font-weight: 600; }
.hero-ctrl { position: absolute; left: 56px; right: 56px; bottom: 34px; z-index: 3; display: flex; align-items: center; gap: 14px; }
.hero-bars { display: flex; gap: 8px; flex: 0 1 360px; }
.hero-bar { flex: 1; height: 4px; border: 0; padding: 10px 0; background: none; cursor: pointer; position: relative; }
.hero-bar::before, .hero-bar i { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 3px; margin-top: -1.5px; border-radius: 3px; background: rgba(255,255,255,.22); }
.hero-bar i { right: auto; width: 0; background: var(--gold); }
.hero-bar.done i { width: 100%; }
.hero-bar.on i { animation: heroFill var(--dur, 6s) linear forwards; }
/* Countdown waits until the picture is in (.run); the pause button and keyboard focus stop it. Not hover: the hero fills the screen. */
.hero-car:not(.run) .hero-bar.on i, .hero-car.paused .hero-bar.on i, .hero-car:has(:focus-visible) .hero-bar.on i { animation-play-state: paused; }
.hero-car.still .hero-bar.on i { animation: none; width: 100%; }
@keyframes heroFill { from { width: 0; } to { width: 100%; } }
.hero-arrows { display: flex; gap: 8px; margin-left: auto; }
.hero-arrows button { width: 40px; height: 40px; border-radius: 999px; border: 1px solid #3A3834; background: rgba(15,15,14,.5); color: #fff; cursor: pointer; display: grid; place-items: center; font-size: 18px; }

/* ── Sliding row (Shop by need) ── */
.slider { position: relative; }
.slider-track { display: grid; grid-auto-flow: column; grid-auto-columns: calc((100% - 3 * 14px) / 4.35); gap: 14px; overflow-x: auto; scroll-snap-type: x mandatory; scroll-behavior: smooth; scrollbar-width: none; padding-bottom: 4px; overscroll-behavior-x: contain; }

  const orders = [];
  const now = Date.now();
  let num = 1001;
  for (let d = 29; d >= 0; d--) {
    const count = 2 + Math.floor(r() * 6) + (d < 8 ? 2 : 0);
    for (let k = 0; k < count; k++) {
      const c = customers[Math.floor(r() * customers.length)];
      const items = [];
      const n = 1 + Math.floor(r() * 3);
      for (let j = 0; j < n; j++) { const p = BASE_PRODUCTS[Math.floor(r() * BASE_PRODUCTS.length)]; const ex = items.find(x => x.pid === p.id); if (ex) ex.qty++; else items.push({ pid: p.id, qty: 1, price: p.price }); }
      const sub = round2(items.reduce((s, x) => s + x.price * x.qty, 0));
      const del = sub >= 40 ? 0 : 3.99;
      const t = now - d * 86400000 - Math.floor(r() * 36000000);
      const status = d > 2 ? (r() < 0.04 ? "refunded" : "dispatched") : (r() < 0.45 ? "dispatched" : "paid");
      orders.push({ id: "TS-" + (num++), cid: c.id, customer: c.name, town: c.town, items, subtotal: sub, delivery: del, discount: 0, total: round2(sub + del), status, at: t, subscription: r() < 0.22 });
    }
  }
  const subs = [];
  for (let i = 0; i < 31; i++) {
    const c = customers[i];
    const p = BASE_PRODUCTS[Math.floor(r() * BASE_PRODUCTS.length)];
    subs.push({ id: "S-" + (2001 + i), cid: c.id, customer: c.name, pid: p.id, freq: 1 + Math.floor(r() * 3), next: now + Math.floor(r() * 50) * 86400000, status: r() < 0.12 ? "paused" : "active" });
  }
  return { customers, orders, subs, abandoned: 14 };
}

  put(k, blob) { return new Promise((res, rej) => { try { const q = IDB.tx("readwrite").put(blob, k); q.onsuccess = () => res(); q.onerror = () => rej(q.error); } catch (e) { rej(e); } }); },

function lineUnit(l) {
  if (l.bundle) { const b = bundleById(l.bundle); const base = b.items.reduce((s, id) => s + P(id).price, 0); return round2(base * (1 - b.discount / 100)); }
  const p = P(l.pid); return l.sub && S.settings.subscribe.on ? subPrice(p) : p.price;
}
function bundleById(id) { if (id === "quiz") return S.quizBundle; return S.bundles.find(b => b.id === id); }
function lineFull(l) { if (l.bundle) { const b = bundleById(l.bundle); return round2(b.items.reduce((s, id) => s + P(id).price, 0)); } return P(l.pid).price; }
function totals() {
  const st = S.settings;
  const full = round2(S.cart.reduce((s, l) => s + lineFull(l) * l.qty, 0));
  const afterLine = round2(S.cart.reduce((s, l) => s + lineUnit(l) * l.qty, 0));
  const subSave = round2(S.cart.filter(l => !l.bundle && l.sub && st.subscribe.on).reduce((s, l) => s + (lineFull(l) - lineUnit(l)) * l.qty, 0));
  const bundleSave = round2(S.cart.filter(l => l.bundle).reduce((s, l) => s + (lineFull(l) - lineUnit(l)) * l.qty, 0));
  // Multi-buy: only one-time single items count.
  let multi = 0, multiLabel = "";
  if (st.multibuy.on) {
    const units = [];
    S.cart.filter(l => !l.bundle && !(l.sub && st.subscribe.on)).forEach(l => { for (let i = 0; i < l.qty; i++) units.push(P(l.pid).price); });
    if (st.multibuy.mode === "3for2") { units.sort((a, b) => b - a); for (let i = 2; i < units.length; i += 3) multi += units[i]; multiLabel = "3 for 2"; }
    else if (st.multibuy.mode === "2save10" && units.length >= 2) { multi = units.reduce((a, b) => a + b, 0) * 0.10; multiLabel = "Buy 2, save 10%"; }
    else if (st.multibuy.mode === "3save20" && units.length >= 3) { multi = units.reduce((a, b) => a + b, 0) * 0.20; multiLabel = "Buy 3, save 20%"; }
    multi = round2(multi);
  }
  let merch = round2(afterLine - multi);
  let codeSave = 0, codeObj = null;
  if (st.codes.on && S.code) { codeObj = S.codes.find(c => c.code === S.code && c.on); if (codeObj) codeSave = round2(merch * codeObj.pct / 100); }
  merch = round2(merch - codeSave);
  let pointsUsed = 0, pointsSave = 0;
  if (st.rewards.on && S.user && S.redeem && S.myPoints >= st.rewards.minRedeem) {
    const maxPts = Math.floor(merch * 100 / st.rewards.pointValue);
    pointsUsed = Math.min(Math.floor(S.myPoints / 100) * 100, Math.floor(maxPts / 100) * 100);
    pointsSave = round2(pointsUsed * st.rewards.pointValue / 100);
  }
  merch = round2(merch - pointsSave);
  const freeOn = st.freeDelivery.on;
  const delivery = S.cart.length === 0 ? 0 : (freeOn && merch >= st.freeDelivery.threshold ? 0 : st.delivery[S.zone || "mainland"]);
  const total = round2(merch + delivery);
  const earn = st.rewards.on ? Math.floor(merch) * st.rewards.earn : 0;
  const count = S.cart.reduce((s, l) => s + l.qty, 0);
  return { full, subSave, bundleSave, multi, multiLabel, codeSave, codeObj, pointsUsed, pointsSave, merch, delivery, total, earn, count, saved: round2(subSave + bundleSave + multi + codeSave + pointsSave) };
}

/* Quiz (questions and suggestions come from the admin's quiz editor) */
function answerHas(a, qid, oid) { const v = a[qid]; return Array.isArray(v) ? v.includes(oid) : v === oid; }
function shown(q, a) { if (!q.showIf || !q.showIf.q) return true; const has = answerHas(a, q.showIf.q, q.showIf.o); return q.showIf.op === "not" ? !has : has; }
function quizSteps(a) { return S.quiz.filter(q => q.on && q.opts.length && shown(q, a)); }
function recommend(a) {
  const out = []; let gp = false;
  quizSteps(a).forEach(q => q.opts.forEach(o => {
    if (!answerHas(a, q.id, o.id)) return;
    if (o.gp) gp = true;
    const p = P(o.pid);
    if (p && p.active !== false && !out.find(x => x.id === p.id)) out.push({ id: p.id, why: o.why || (p.benefits[0] ? p.benefits[0] + "." : p.short) });
  }));
  return { recs: out.slice(0, Math.max(1, S.settings.quiz.max || 3)), gp };
}
function quiz() {
  const st = S.settings;
  if (!st.quiz.on) return `<main class="wrap"><div class="empty" style="margin-top:40px"><b>The quiz is switched off</b><button class="btn sm" data-go="shop:">Shop all products</button></div></main>`;
  const a = S.quizA || {}; const steps = quizSteps(a); const i = S.quizI || 0;
  if (i >= steps.length) {
    const { recs, gp } = recommend(a);
    if (!recs.length) return `<main class="wrap"><div class="quiz"><div class="qbar"><span style="width:100%"></span></div><h1>We don't have a suggestion for those answers</h1>${gp ? `<div class="notice warn">As you're pregnant, breastfeeding or taking medication, please check with your GP or pharmacist before starting any supplement.</div>` : ""}<p style="color:var(--ink-2)">Have a look at our best sellers, or start again with different answers.</p><div class="qnav"><button class="btn ghost" data-act="quizreset">Start again</button><button class="btn" data-go="shop:sort=best">See best sellers</button></div></div></main>`;
    const base = round2(recs.reduce((s2, r) => s2 + P(r.id).price, 0));
    const price = round2(base * (1 - st.quiz.discount / 100));
    S.quizBundle = { id: "quiz", name: "Your quiz set", items: recs.map(r => r.id), discount: st.quiz.discount };
    return `<main class="wrap"><div class="quiz"><div class="qbar"><span style="width:100%"></span></div>
      <h1>Your suggested set</h1>
      ${gp ? `<div class="notice warn">As you're pregnant, breastfeeding or taking medication, please check with your GP or pharmacist before starting any of these.</div>` : ""}
      <div class="result">${recs.map(r => { const p = P(r.id); return `<div class="rec"><div class="im">${pic(p.id)}</div><div><b>${esc(p.name)}</b><p>${esc(r.why)}</p><p class="num" style="color:var(--ink)">${gbp(p.price)}</p></div><button class="btn ghost sm" data-go="product:${p.id}">View</button></div>`; }).join("")}</div>
      <div class="band" style="background:var(--surface);padding:28px"><div><h2 style="font-size:28px">${recs.length === 1 ? "Get it" : "Take all " + recs.length}${st.quiz.discount ? ` and save ${st.quiz.discount}%` : ""}</h2><p class="num"><span class="price" style="font-size:22px">${gbp(price)}</span> ${st.quiz.discount ? `<span class="was">${gbp(base)}</span>` : ""}</p></div><div class="actions" style="justify-content:flex-end"><button class="btn" data-addbundle="quiz">Add the set to basket</button><button class="btn ghost" data-act="quizreset">Start again</button></div></div>
      <p style="font-size:13px;color:var(--ink-3)">These suggestions are general information, not medical advice.</p>
    </div></main>`;
  }
  const q = steps[i]; const cur = a[q.id];
  const sel = v => q.multi ? (cur || []).includes(v) : cur === v;
  return `<main class="wrap"><div class="quiz">
    <div class="qbar" aria-label="Question ${i + 1} of ${steps.length}"><span style="width:${(i / steps.length) * 100}%"></span></div>
    <p style="color:var(--ink-2);font-weight:600">Question ${i + 1} of ${steps.length}</p>
    <h1>${esc(q.q)}</h1>
    ${q.multi ? `<p style="color:var(--ink-2)">Choose as many as you like.</p>` : ""}
    <div class="qopts">${q.opts.map(o => `<button class="qopt" aria-pressed="${sel(o.id)}" data-qa="${q.id}" data-qv="${o.id}" data-multi="${q.multi ? 1 : 0}">${esc(o.label)}${sel(o.id) ? "<span>✓</span>" : ""}</button>`).join("")}</div>
    <div class="qnav"><button class="btn ghost" data-act="qback" ${i === 0 ? "disabled" : ""}>Back</button><button class="btn" data-act="qnext" ${cur && (!q.multi || cur.length) ? "" : "disabled"}>${i === steps.length - 1 ? "See my set" : "Next"}</button></div>
  </div></main>`;
}

function bindChart() {
  const el = document.getElementById("revchart"); if (!el) return;
  const series = revenueSeries(); const svg = el.querySelector("svg"); const tip = el.querySelector(".tip");
  const W = 720, pl = 48, pr = 12, pt = 16, pb = 28, H = 240;
  const top = Math.ceil(Math.max(...series.map(d => d.v)) / 100) * 100 || 100;
  const move = e => {
    const r = svg.getBoundingClientRect(); const px = (e.clientX - r.left) / r.width * W;
    const i = Math.max(0, Math.min(series.length - 1, Math.round((px - pl) / (W - pl - pr) * (series.length - 1))));
    const x = pl + (W - pl - pr) * i / (series.length - 1), y = pt + (H - pt - pb) * (1 - series[i].v / top);
    svg.querySelector("#cx").setAttribute("x1", x); svg.querySelector("#cx").setAttribute("x2", x); svg.querySelector("#cx").setAttribute("opacity", ".3");
    const dot = svg.querySelector("#cdot"); dot.setAttribute("cx", x); dot.setAttribute("cy", y); dot.setAttribute("opacity", "1");
    tip.hidden = false; tip.style.left = (x / W * 100) + "%"; tip.style.top = (y / H * r.height) + "px";
    tip.innerHTML = `<b>${day(series[i].t)}</b> ${gbp(series[i].v)}, ${series[i].n} orders`;
  };
  const rect = svg.querySelector("[data-chart]");
  rect.addEventListener("pointermove", move);
  rect.addEventListener("pointerleave", () => { tip.hidden = true; svg.querySelector("#cdot").setAttribute("opacity", "0"); svg.querySelector("#cx").setAttribute("opacity", "0"); });
}

document.addEventListener("pointerdown", e => { const b = document.getElementById("sugg"); if (b && !e.target.closest(".search")) b.innerHTML = ""; });

/* Announcement rotation and welcome card */
setInterval(() => { const el = document.getElementById("ann"); const m = S.settings.announcement.messages; if (!el || m.length < 2 || document.hidden) return; annIdx++; el.textContent = m[annIdx % m.length]; el.style.animation = "none"; void el.offsetWidth; el.style.animation = ""; }, 4500);
setTimeout(() => { if (!S.welcomeDismissed && S.view === "shop" && S.route.page === "home" && S.settings.welcome.on && !(S.settings.freebie && S.settings.freebie.on)) { S.showWelcome = true; render(true); } }, 5000);

document.addEventListener("animationend", e => { if (e.target.matches && e.target.matches(".hero-bar.on i")) { const car = document.getElementById("herocar"); if (car && !car.classList.contains("still")) heroShow((S.heroI || 0) + 1); } });
let heroX = null;
document.addEventListener("pointerdown", e => { heroX = e.target.closest && e.target.closest("#herocar") ? e.clientX : null; });
document.addEventListener("pointerup", e => { if (heroX === null) return; const dx = e.clientX - heroX; heroX = null; if (Math.abs(dx) > 50) heroShow((S.heroI || 0) + (dx < 0 ? 1 : -1)); });
document.addEventListener("scroll", e => { const el = e.target; if (!el.classList || !el.classList.contains("slider-track")) return; const c = el.firstElementChild; const k = c ? Math.round(el.scrollLeft / (c.offsetWidth + 14)) : 0; const dots = el.parentElement.querySelectorAll(".slider-dots span"); dots.forEach((d2, j) => d2.classList.toggle("on", j === Math.min(k, dots.length - 1))); }, true);
try { if (!sessionStorage.getItem("tova-demo-visit")) { sessionStorage.setItem("tova-demo-visit", "1"); const vs = visitSource(); track("visit", `${S.events && S.events.some(e => e.type === "visit") ? "Returning visit" : "First visit"}${vs.from === "direct" ? "" : " from " + vs.from} on a ${vs.device}`); save(); } } catch (e) {}
const fbArmed = Date.now();
setInterval(() => {
  const fb = S.settings.freebie; if (!fb || !fb.on || !fb.popup || S.fbGot || S.fbOpen || S.fbShownThisVisit) return;
  if (S.fbDismissedAt && Date.now() - S.fbDismissedAt < fb.remindDays * 86400000) return;
  if (Date.now() - fbArmed < Math.max(5, +fb.delaySec || 12) * 1000) return;
  if (S.view !== "shop" || !S.cookie || cartOpen || S.menuOpen || ["checkout", "account"].includes(S.route.page)) return;
  S.fbOpen = true; S.fbShownThisVisit = true; render(true);
}, 1000);
setInterval(() => { const el = document.getElementById("livenow"); if (el && !document.hidden) el.textContent = liveCount(); }, 6000);
S.settings.business = S.settings.business || { name: "Tova-Ster Ltd", address: "Registered address to confirm, United Kingdom", company: "Company no. to confirm", vatNo: "GB VAT no. to confirm", email: "info@tova-ster.com", web: "tova-ster.com", footer: "Thank you for shopping with Tova-Ster. Questions about your order? Email info@tova-ster.com." };
S.settings.dispatch = S.settings.dispatch || { autoLabel: true, batchOn: true, batchTime: 13, scanDispatch: true, trackingEmail: true, deliveredEmail: true, reviewEmail: true, holdOn: true, holdOver: 120, autoHideOOS: true, subsAuto: true, subsDays: 3, partner: false, carriers: { mainland: "Royal Mail Tracked 48", highlands: "Royal Mail Tracked 48", ni: "DPD Next Day" } };
S.orders.forEach(o => { if (!o.ful) o.ful = initFul(o); if (!o.discounts) o.discounts = o.discount ? [{ label: "Discounts", amount: o.discount }] : []; });
S.myOrders.forEach(o => { const twin = S.orders.find(x => x.id === o.id); if (twin) Object.assign(o, twin); });
S.settings.emails = S.settings.emails || { welcome: true, dispatched: true, delivered: true, basket: true, basketSteps: [1, 3, 7], basketCodeOn: true, basketCode: 10, subReminder: true, points: true, review: true, backInStock: true, winback: true, winbackDays: 60 };
S.team = S.team || [{ name: "Client owner", email: "info@tova-ster.com", role: "Owner", twofa: true, you: true }, { name: "Store manager", email: "manager@tova-ster.com", role: "Manager", twofa: true }, { name: "Packing team", email: "packing@tova-ster.com", role: "Packer", twofa: false }];
S.site = S.site || defaultSite();
S.toast = null; S.showWelcome = false; S.lb = null; S.fbOpen = false; S.fbShownThisVisit = false; S.fbDone = S.fbGot ? S.fbDone : null; S.settings.freebie = S.settings.freebie || JSON.parse(JSON.stringify(DEFAULT_SETTINGS.freebie));
render();
IDB.open().then(() => IDB.all()).then(rows => { rows.forEach(([k, b]) => { MURL[k] = URL.createObjectURL(b); }); if (rows.length) render(true); }).catch(() => {});
})();
</script>
